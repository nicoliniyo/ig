server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # gzip for text-based resources (Req 3.1, 3.2)
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_types
        text/css
        application/javascript
        application/json
        application/fhir+json
        text/turtle
        application/xml;
    # text/html is always compressed by nginx when gzip is on; it is not
    # listed in gzip_types by design.

    # Immutable, long-lived static assets (Req 3.3)
    location ~* \.(?:css|js|woff2?|ttf|eot|otf|png|jpe?g|gif|svg|ico|webp|bmp)$ {
        # Regex locations are terminal and do not fall through to `location /`,
        # so make the 404 guarantee explicit for a missing file (Req 4.2).
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # FHIR data files: cacheable but shorter, since content may be regenerated
    location ~* \.(?:json|ttl|xml|shex|pack)$ {
        try_files $uri =404;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # HTML pages: revalidate so content updates are picked up
    location ~* \.html$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    # Default document + 404 (Req 1.3, 4.2)
    # Serves index.html at the root; any path with no matching file or
    # directory returns nginx's built-in 404 (no SPA-style fallback).
    location / {
        try_files $uri $uri/ =404;
    }
}
